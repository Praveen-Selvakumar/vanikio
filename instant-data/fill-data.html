<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VANIKIO — Fill Your Data</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #f7f5ff;
            --surface: #fcfbff;

            --primary: #6c4cf1;
            --primary-dark: #5938dc;
            --primary-soft: #ece7ff;

            --secondary: #20b8a6;

            --text: #27243a;
            --text-soft: #514b60;
            --muted: #77738a;
            --muted-light: #9993aa;

            --border: #e6e2f0;

            --danger: #d85c6e;
            --danger-soft: #fff4f6;

            --success: #168271;
            --success-soft: #edfbf7;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Poppins, sans-serif;

            background:
                radial-gradient(
                    circle at 85% 5%,
                    rgba(108, 76, 241, .09),
                    transparent 25%
                ),
                var(--bg);

            color: var(--text);

            min-height: 100vh;

            padding-bottom: 100px;
        }


        /* HEADER */

        .header {
            height: 72px;

            position: sticky;
            top: 0;

            z-index: 20;

            background:
                rgba(252, 251, 255, .9);

            backdrop-filter: blur(18px);

            border-bottom: 1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;
        }


        .brand {
            display: flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: var(--text);
        }


        .logo {
            width: 39px;
            height: 39px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: 800;

            font-size: 20px;
        }


        .brand-name {
            font-weight: 700;

            font-size: 20px;
        }


        .back {
            font-size: 12px;

            color: var(--muted);

            cursor: pointer;

            transition: .2s ease;
        }


        .back:hover {
            color: var(--primary);
        }


        /* PAGE */

        .page {
            width: min(760px, 92%);

            margin: auto;

            padding-top: 45px;
        }


        .intro {
            margin-bottom: 25px;
        }


        .eyebrow {
            color: var(--primary);

            text-transform: uppercase;

            letter-spacing: 1.3px;

            font-size: 10px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        h1 {
            font-size: 35px;

            line-height: 1.2;

            letter-spacing: -1px;
        }


        .intro p {
            margin-top: 9px;

            color: var(--text-soft);

            font-size: 13px;

            line-height: 1.7;
        }


        /* SELECTED DESIGN */

        .design-chip {
            display: flex;

            align-items: center;

            gap: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-soft),
                    var(--surface)
                );

            border: 1px solid #dcd4ff;

            border-radius: 18px;

            padding: 16px;

            margin-bottom: 22px;
        }


        .chip-icon {
            width: 43px;
            height: 43px;

            border-radius: 13px;

            background: var(--primary);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 18px;
        }


        .chip-label {
            color: var(--muted);

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: .8px;
        }


        .chip-title {
            font-size: 13px;

            font-weight: 700;

            margin-top: 2px;
        }


        /* FORM */

        .form-card {
            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 25px;

            padding: 28px;

            box-shadow:
                0 18px 50px rgba(108, 76, 241, .07);
        }


        .form-title {
            font-size: 17px;

            font-weight: 700;

            margin-bottom: 4px;
        }


        .form-description {
            color: var(--muted);

            font-size: 11px;

            margin-bottom: 24px;
        }


        .fields {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 17px;
        }


        .field {
            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .field.full {
            grid-column: 1 / -1;
        }


        label {
            font-size: 11px;

            font-weight: 600;

            color: var(--text-soft);
        }


        label span {
            color: var(--danger);
        }


        input,
        textarea {
            width: 100%;

            border: 1px solid var(--border);

            background: #ffffff;

            border-radius: 12px;

            padding: 12px 13px;

            outline: none;

            color: var(--text);

            font-family: inherit;

            font-size: 12px;

            transition: .2s ease;
        }


        textarea {
            min-height: 105px;

            resize: vertical;
        }


        input:focus,
        textarea:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(108, 76, 241, .08);
        }


        input:required {
            background: #ffffff;
        }


        .optional {
            color: var(--muted-light);

            font-size: 9px;

            font-weight: 400;

            margin-left: 3px;
        }


        .hint {
            color: var(--muted);

            font-size: 9px;

            line-height: 1.5;
        }


        /* BOTTOM */

        .bottom {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 30;

            padding: 13px 6%;

            background:
                rgba(252, 251, 255, .95);

            backdrop-filter: blur(18px);

            border-top: 1px solid var(--border);
        }


        .bottom-inner {
            width: min(760px, 92%);

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        .required-note {
            color: var(--muted);

            font-size: 10px;
        }


        .generate {
            height: 48px;

            padding: 0 22px;

            border: none;

            border-radius: 13px;

            background: var(--primary);

            color: white;

            font-family: inherit;

            font-weight: 700;

            font-size: 11px;

            cursor: pointer;

            transition: .2s ease;

            box-shadow:
                0 10px 25px rgba(108, 76, 241, .2);
        }


        .generate:hover {
            background: var(--primary-dark);

            transform: translateY(-2px);
        }


        /* MOBILE */

        @media(max-width:600px) {

            .page {
                padding-top: 30px;
            }


            h1 {
                font-size: 29px;
            }


            .form-card {
                padding: 21px;
            }


            .fields {
                grid-template-columns: 1fr;
            }


            .field.full {
                grid-column: auto;
            }


            .bottom-inner {
                width: 90%;
            }


            .required-note {
                display: none;
            }


            .generate {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <a
        href="upcoming-files.html"
        class="brand"
    >

        <div class="logo">
            V
        </div>

        <div class="brand-name">
            VANIKIO
        </div>

    </a>


    <div
        class="back"
        onclick="history.back()"
    >
        ← Change design
    </div>

</header>



<main class="page">


    <section class="intro">

        <div class="eyebrow">
            Step 3 · Your information
        </div>

        <h1>
            Fill in your details.
        </h1>

        <p>
            Add the information you want people to see.
            Business name and mobile number are required.
            Everything else is optional.
        </p>

    </section>



    <!-- SELECTED DESIGN -->

    <div class="design-chip">

        <div class="chip-icon">
            ✦
        </div>

        <div>

            <div class="chip-label">
                Selected design
            </div>

            <div
                class="chip-title"
                id="selectedDesign"
            >
                Loading...
            </div>

        </div>

    </div>



    <!-- FORM -->

    <div class="form-card">

        <div class="form-title">
            Basic information
        </div>

        <div class="form-description">
            Fields marked with * are required.
        </div>


        <div class="fields">


            <!-- TITLE -->

            <div class="field full">

                <label for="title">
                    Title
                    <span class="optional">
                        Optional
                    </span>
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Example: Learn better. Grow further."
                >

            </div>



            <!-- BUSINESS MOTTO -->

            <div class="field full">

                <label for="motto">
                    Business Motto
                    <span class="optional">
                        Optional
                    </span>
                </label>

                <input
                    type="text"
                    id="motto"
                    placeholder="Example: Quality learning for every student"
                >

            </div>



            <!-- DESCRIPTION -->

            <div class="field full">

                <label for="description">
                    Description
                    <span class="optional">
                        Optional
                    </span>
                </label>

                <textarea
                    id="description"
                    placeholder="Tell people about your business, service or event..."
                ></textarea>

            </div>



            <!-- BUSINESS NAME -->

            <div class="field">

                <label for="business">
                    Business Name
                    <span>*</span>
                </label>

                <input
                    type="text"
                    id="business"
                    placeholder="Example: Bright Future Academy"
                    autocomplete="organization"
                    required
                    aria-required="true"
                >

            </div>



            <!-- ADDRESS -->

            <div class="field">

                <label for="address">
                    Address
                    <span class="optional">
                        Optional
                    </span>
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Example: Madurai, Tamil Nadu"
                    autocomplete="street-address"
                >

            </div>



            <!-- MOBILE NUMBER -->

            <div class="field">

                <label for="phone">
                    Mobile Number
                    <span>*</span>
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="+91 98765 43210"
                    autocomplete="tel"
                    required
                    aria-required="true"
                >

            </div>


        </div>

    </div>

</main>



<!-- BOTTOM -->

<div class="bottom">

    <div class="bottom-inner">

        <div class="required-note">
            * Required fields
        </div>

        <button
            class="generate"
            onclick="generateQR()"
        >
            Generate QR →
        </button>

    </div>

</div>



<script>


/* =========================================================
   READ SELECTED DESIGN
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const category =
    params.get("category") || "";


const design =
    params.get("design") || "";


const categoryId =
    params.get("categoryId") || "";


const designId =
    params.get("designId") || "";


document.getElementById(
    "selectedDesign"
).textContent =
    `${category} · ${design}`;



/* =========================================================
   GENERATE QR
========================================================= */

function generateQR() {

    const business =
        document
            .getElementById("business")
            .value
            .trim();


    const phone =
        document
            .getElementById("phone")
            .value
            .trim();


    /* BUSINESS NAME */

    if (!business) {

        alert(
            "Please enter your business name."
        );

        document
            .getElementById("business")
            .focus();

        return;
    }


    /* MOBILE NUMBER */

    if (!phone) {

        alert(
            "Please enter your mobile number."
        );

        document
            .getElementById("phone")
            .focus();

        return;
    }



    /* =====================================================
       COLLECT DATA
    ===================================================== */

    const data = {

        category,
        categoryId,

        design,
        designId,


        title:
            document
                .getElementById("title")
                .value
                .trim(),


        motto:
            document
                .getElementById("motto")
                .value
                .trim(),


        description:
            document
                .getElementById("description")
                .value
                .trim(),


        business:
            business,


        address:
            document
                .getElementById("address")
                .value
                .trim(),


        phone:
            phone

    };



    /* =====================================================
       TEMPORARY FRONTEND STORAGE

       No Firebase
       No Server
       No Database
    ===================================================== */

    sessionStorage.setItem(
        "vanikioInstantData",
        JSON.stringify(data)
    );



    /* =====================================================
       GO TO QR RESULT
    ===================================================== */

    window.location.href =
        "qr-result.html";

}

</script>


</body>

</html>
